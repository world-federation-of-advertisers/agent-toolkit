name: ci

# Typecheck, build, and run the full test suite for the halo-mcp plugin on
# every PR and on pushes to main. (Skill linting runs separately in
# lint-skills.yml; release artifacts are built in release.yml on tags.)

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/halo-mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/halo-mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + build (UI + server)
        run: npm run build

      - name: Run tests (unit + e2e)
        run: npm test
